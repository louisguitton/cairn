version: 2

project_name: cairn

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/cairn
    binary: cairn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Casks, not formulas: Homebrew wants prebuilt binaries distributed as casks
# in third-party taps. Casks are macOS-only — Linux users install via
# `go install` or the release archives.
homebrew_casks:
  - name: cairn
    binaries: [cairn]
    repository:
      owner: louisguitton
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/louisguitton/cairn"
    description: "Prompt-driven Product Design Thinking kit on the IBM EDT Loop"
    license: "MIT"
    hooks:
      post:
        # Strip the quarantine flag Gatekeeper adds to downloaded binaries,
        # otherwise the first `cairn` run is blocked on macOS.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cairn"]
          end
